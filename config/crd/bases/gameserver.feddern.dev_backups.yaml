---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: backups.gameserver.feddern.dev
spec:
  group: gameserver.feddern.dev
  names:
    kind: Backup
    listKind: BackupList
    plural: backups
    shortNames:
    - gsb
    singular: backup
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.gameServerRef.name
      name: GameServer
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.volumeSnapshotName
      name: Snapshot
      type: string
    - jsonPath: .status.restoreSize
      name: Size
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Backup captures a point-in-time snapshot of a GameServer's data PVC
          via the Kubernetes VolumeSnapshot API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: BackupSpec is the desired state of a one-shot backup.
            properties:
              gameServerRef:
                description: gameServerRef selects which GameServer's data PVC to
                  snapshot.
                properties:
                  name:
                    description: name of the referenced GameServer.
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              retainForever:
                description: |-
                  retainForever excludes this Backup from BackupSchedule retention
                  GC. Use for pre-upgrade / milestone snapshots you want to keep
                  past the schedule's `keep` window.
                type: boolean
              volumeSnapshotClassName:
                description: |-
                  volumeSnapshotClassName picks the VolumeSnapshotClass used for the
                  underlying snapshot.storage.k8s.io/v1 VolumeSnapshot. Empty falls
                  back to the cluster's default VolumeSnapshotClass — works with any
                  CSI driver (Synology, Longhorn, Ceph, EBS, etc.); nothing here is
                  driver-specific.
                type: string
            required:
            - gameServerRef
            type: object
          status:
            description: BackupStatus is the observed state of a backup.
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              creationTime:
                description: creationTime is when the VolumeSnapshot became ReadyToUse.
                format: date-time
                type: string
              observedGeneration:
                description: |-
                  observedGeneration reflects the .metadata.generation this status
                  corresponds to.
                format: int64
                type: integer
              phase:
                description: phase is a coarse summary. Details in conditions.
                enum:
                - Pending
                - InProgress
                - Ready
                - Failed
                - Deleted
                type: string
              restoreSize:
                description: |-
                  restoreSize is the size a restored PVC would need (from the
                  underlying VolumeSnapshotContent).
                type: string
              snapshotHandle:
                description: |-
                  snapshotHandle is the CSI-assigned handle for the underlying
                  storage snapshot; useful for correlation with CSI backends.
                type: string
              volumeSnapshotName:
                description: |-
                  volumeSnapshotName is the name of the child VolumeSnapshot in the
                  same namespace. Populated as soon as the controller creates it.
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
