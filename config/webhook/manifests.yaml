---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: validating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /validate-gameserver-feddern-dev-v1alpha1-gameserver
  failurePolicy: Fail
  name: vgameserver-v1alpha1.kb.io
  rules:
  - apiGroups:
    - gameserver.feddern.dev
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - gameservers
  sideEffects: None
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /validate-gameserver-feddern-dev-v1alpha1-gametemplate
  failurePolicy: Fail
  name: vgametemplate-v1alpha1.kb.io
  rules:
  - apiGroups:
    - gameserver.feddern.dev
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - gametemplates
  sideEffects: None
