resources:
- manager.yaml

# Image reference: overridden here so downstream overlays (config/default,
# config/openshift) inherit it. Bump `newTag` when a new image is pushed.
images:
- name: controller
  newName: ghcr.io/mistereleven/gameserver-operator
  # docker/metadata-action strips the `v` from git tags per the OCI
  # convention, so `git tag v0.1.0` → image tag `0.1.0`.
  newTag: "0.2.0"
