  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - apps
  resources:
  - deployments
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - gameserver.feddern.dev
  resources:
  - backups
  - backupschedules
  - gameservers
  - gametemplates
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
